function renderAutoH(cont,d,h,closed){
  const q=(d.ret||{})[h.code];const cur=(q&&q.price)||h.last||0;const cost=h.cost||0;

    else if(pnl>=12)advice='🏆 '+fmtp(pnl)+' 浮盈 · 关注止盈/离场信号 · '+advice;
  }

function l1For(d,h){

    if(se)return (se.is_sim?'📈 模拟盘卖出信号:':'🔴 主仓卖出信号:')+((se).verdict||'按纪律离场')+' · '+stratDesc(h.strat||'指星')+'。';
    const hd=(z.hold||[]).find(x=>String(x.code).slice(-6)===c);
    if(hd)return (hd.is_sim?'👀 模拟盘持有:':'👀 主仓持有:')+((hd).verdict||'持有')+' · '+stratDesc(h.strat||'指星')+'。';

  return stratDesc(h.strat||'自选')+' 持仓跟踪中, 暂无该股新信号。';
}

/* ===== Auth (与语之境界同源) ===== */
function initClient(){try{if(window.supabase)DB=supabase.createClient(SB_URL,SB_ANON)}catch(e){DB=null}}
function openAuth(){$('authMsg').textContent='';$('authModal').classList.remove('hidden')}
function closeAuth(){$('authModal').classList.add('hidden')}
async function doLogout(){try{await DB.auth.signOut()}catch(e){}DBUSER=null;authed=false;MYH=[];$('acctBtn').textContent='🔐 登录';toast&&toast('已退出');showTab(CUR)}
function toast(m){const e=el('div','','');const x=el('div','banner info',m);e.appendChild(x);document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
async function applySession(ses){const u=ses&&ses.user;if(u){DBUSER=u;authed=true;$('acctBtn').textContent='👤 '+(u.email||u.id.slice(0,6));await loadHoldings();showTab(CUR)}else{DBUSER=null;authed=false;MYH=[];AUTOH=[];$('acctBtn').textContent='🔐 登录';showTab(CUR)}}
function bindAuth(){
  $('acctBtn').onclick=()=>{DBUSER?doLogout():openAuth()};
  $('authClose').onclick=closeAuth;
  $('authLogin').onclick=async()=>{const e=$('authEmail').value.trim(),p=$('authPass').value;$('authMsg').textContent='';if(!e||!p){$('authMsg').textContent='请填写邮箱和密码';return}const{data,error}=await DB.auth.signInWithPassword({email:e,password:p});if(error){$('authMsg').textContent=error.message;return}closeAuth();applySession(data.session)};
  $('authRegister').onclick=async()=>{const e=$('authEmail').value.trim(),p=$('authPass').value;$('authMsg').textContent='';if(!e||!p){$('authMsg').textContent='请填写邮箱和密码';return}if(p.length<6){$('authMsg').textContent='密码至少6位';return}const{data,error}=await DB.auth.signUp({email:e,password:p});if(error){$('authMsg').textContent=error.message;return}if(data.session){closeAuth();applySession(data.session)}else{$('authMsg').textContent='注册成功,请到邮箱确认后登录'}};
}
function bindNav(){
  document.querySelectorAll('#navTabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
  $('histPrev').onclick=()=>{if(HISTI>0){HISTI--;fillHistSel();renderHist()}};
  $('histNext').onclick=()=>{if(HISTI<DATE_LIST.length-1){HISTI++;fillHistSel();renderHist()}};
  $('histDate').onchange=()=>{HISTI=+$('histDate').value;renderHist()};
}
async function init(){
  initClient();bindAuth();bindNav();
  if(DB){try{const{data:{session}}=await DB.auth.getSession();applySession(session);DB.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'||ev==='USER_UPDATED')applySession(s);if(ev==='SIGNED_OUT')applySession(null)})}catch(e){}}
  showTab('today');
}
document.addEventListener('DOMContentLoaded',init);
</script>
