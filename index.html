<style>
:root{--gold:#f2a25c;--gold2:#ffc76e;--bg:#0d1020;--bg2:#141936;--card:#1a2038;--card2:#1e2542;--line:#2b3357;--line2:#3a446e;--txt:#edf0fb;--dim:#9aa3c7;--ok:#37d7c6;--bad:#f0567e;--accent:#6fb3f0;--shadow:0 14px 40px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(1300px 760px at 18% -12%,#20294d 0%,#12172e 46%,#0b0e1e 100%);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:1060px;margin:0 auto;padding:18px 16px 140px}
h1{font-size:23px;letter-spacing:.5px;line-height:1.25;background:linear-gradient(120deg,#fff,#ffe3b8 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 small{color:var(--dim);font-weight:400;letter-spacing:.2px;font-size:12px;display:block;margin-top:5px;-webkit-text-fill-color:var(--dim)}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:linear-gradient(180deg,var(--s1),var(--s2));border:1px solid var(--line);border-top:1px solid var(--line2);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 12px 34px rgba(0,0,0,.32);backdrop-filter:blur(12px);position:relative;transition:box-shadow .2s,border-color .2s}
.card:hover{border-color:var(--line2);box-shadow:0 16px 44px rgba(0,0,0,.40)}
.btn{border:1px solid var(--line);background:var(--s3);color:var(--txt);border-radius:12px;padding:9px 16px;cursor:pointer;font-size:14px;transition:.16s;font-weight:500}
.btn:hover{border-color:var(--line2);background:var(--s4);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.gold{background:linear-gradient(150deg,#f0a25c,#df7f28);border-color:#ffc98a;color:#241403;font-weight:700;box-shadow:0 7px 20px rgba(223,127,40,.38)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{color:var(--dim)}
.btn.acct-btn{margin-left:6px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.nav-tab{position:sticky;top:0;z-index:30;display:flex;gap:5px;margin-bottom:16px;background:var(--s5);border:1px solid var(--line);border-radius:16px;padding:6px;backdrop-filter:blur(14px);overflow-x:auto;box-shadow:0 8px 26px rgba(0,0,0,.28)}
.nav-tab button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--dim);padding:9px 11px;border-radius:11px;cursor:pointer;font-size:13.5px;transition:.15s}
.nav-tab button:hover{color:var(--txt);background:rgba(90,169,230,.08)}
.nav-tab button.on{background:linear-gradient(150deg,rgba(244,162,97,.26),rgba(244,162,97,.10));color:var(--gold2);font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,199,110,.28)}
.hidden{display:none}
.scene-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scene-tag{font-size:15px;font-weight:800;color:#ffe1ae;border:1px solid rgba(255,199,110,.5);background:linear-gradient(150deg,rgba(255,199,110,.22),rgba(244,162,97,.08));border-radius:13px;padding:8px 14px;box-shadow:0 4px 14px rgba(244,162,97,.14)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.chip{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--s6)}
h4{font-size:12.5px;font-weight:600;color:var(--txt);opacity:.88;margin:13px 0 6px;letter-spacing:.2px;line-height:1.4}
.chip b{color:var(--txt)}
h3{font-size:15px;margin:8px 0 11px;padding-left:11px;border-left:3px solid var(--gold);line-height:1.4;text-align:left;font-weight:700;letter-spacing:.3px}
.slist{display:grid;gap:9px}
.sitem{background:var(--s7);border:1px solid var(--line);border-radius:13px;padding:12px 14px;font-size:13.5px;line-height:1.55;transition:border-color .15s,background .15s}
.sitem:hover{border-color:var(--line2);background:var(--s8)}
.sitem .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sitem .nm{font-weight:700}
.sitem .nm .c6{font-weight:400;color:#8a94a6;font-size:11px;margin-left:4px;font-family:ui-monospace,Menlo,monospace}
.sitem .tag{font-size:11px;border-radius:7px;padding:2px 7px;background:rgba(90,169,230,.16);color:var(--accent)}
.sitem .tag.main{background:rgba(244,162,97,.18);color:var(--gold)}
.sitem .tag.bad{background:rgba(239,71,111,.18);color:var(--bad)}
.sitem .tag.ok{background:rgba(46,196,182,.18);color:var(--ok)}
.sitem .why{font-size:12px;color:var(--dim);margin-top:5px}
.sitem .why b{color:var(--txt)}
.tier{font-size:11.5px;color:var(--gold2);font-weight:700;letter-spacing:1.2px;margin:18px 0 7px;display:flex;align-items:center;gap:7px}
.tier::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(244,162,97,.55)}
.banner{border-radius:13px;padding:11px 14px;font-size:13px;margin:8px 0}
.banner.warn{border:1px solid rgba(239,71,111,.4);background:rgba(239,71,111,.10);color:#ff9db4}
.banner.info{border:1px solid rgba(90,169,230,.4);background:rgba(90,169,230,.10);color:#a7d3f7}
.banner.wait{border:1px solid rgba(244,162,97,.4);background:rgba(244,162,97,.10);color:var(--gold)}
.pill{font-size:11px;border-radius:6px;padding:2px 7px;background:rgba(154,160,195,.12);color:var(--dim)}
.slotb{display:inline-block;width:11px;height:11px;border-radius:3px;background:rgba(154,160,195,.16);border:1px solid rgba(154,160,195,.3);margin-left:2px;vertical-align:middle}
.slotb.on{background:#ffc24b;border-color:#ffc24b}
.slotgrid{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.slotrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.slotacc{font-weight:800;color:var(--gold2);font-size:12px;letter-spacing:.5px;margin:6px 0 1px}
.slots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.slotcell{border-radius:8px;padding:4px 9px;font-size:11px;line-height:1.4;border:1px solid var(--line2);white-space:nowrap}
.slotcell.on{background:rgba(46,196,182,.15);color:var(--ok);border-color:rgba(46,196,182,.5)}
.slotcell.off{background:transparent;color:var(--dim);border-style:dashed;border-color:rgba(154,160,195,.4)}
.slotcell.amma{background:rgba(244,162,97,.16);color:var(--gold);border-color:rgba(244,162,97,.52);font-weight:600}
.slotlegend{font-size:10.5px;color:var(--dim);margin-top:8px;line-height:1.6}

.pill.v{background:rgba(239,71,111,.16);color:#ff9db4}
.pill.s{background:rgba(46,196,182,.16);color:var(--ok)}
.pill.w{background:rgba(244,162,97,.16);color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.5px}
td .up{color:var(--bad);font-weight:700}
td .down{color:var(--ok);font-weight:700}
td .flat{color:var(--dim)}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.datebar .btn{padding:7px 13px}
select{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.modal-mask{position:fixed;inset:0;background:rgba(8,10,20,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal-mask.hidden{display:none}
.modal{width:min(360px,92vw);background:var(--s9);border:1px solid var(--line);border-radius:18px;padding:20px}
.auth-input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);margin-bottom:10px;font-size:15px}
.auth-input:focus{outline:none;border-color:var(--accent)}
.btns{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.study-note{font-size:12.5px;color:var(--dim);background:var(--s10);border:1px dashed var(--line);border-radius:12px;padding:11px 13px;margin:8px 0;line-height:1.6}
.legend{display:flex;gap:12px;font-size:11px;color:var(--dim);flex-wrap:wrap;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.footer-note{font-size:12px;color:var(--dim);text-align:center;padding:16px 0 4px;border-top:1px dashed var(--line);margin-top:10px;line-height:1.7}
.footer-note b{color:var(--gold)}
.risk-chip{font-size:11.5px;color:var(--bad);border:1px solid rgba(239,71,111,.4);background:rgba(239,71,111,.08);border-radius:10px;padding:5px 11px;margin-top:8px;display:inline-block}
.board{font-size:10px;color:var(--gold);border:1px solid rgba(255,194,75,.35);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:middle;white-space:nowrap;flex:none}
.minibtn{font-size:12px;color:var(--gold);border:1px solid rgba(255,194,75,.4);border-radius:6px;padding:0 6px;cursor:pointer;margin-left:auto;flex:none;background:transparent}
.minibtn:hover{background:rgba(255,194,75,.15)}
.fld{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:7px 8px;font-size:12px;outline:none;box-sizing:border-box}
.fld:focus{border-color:rgba(255,194,75,.5)}
.lockpad{text-align:center;padding:22px 12px}
.vlog{margin:10px 0 2px;padding-left:14px;border-left:2px solid var(--line)}
.vrow{display:flex;gap:8px;margin:12px 0;align-items:flex-start}
.vbadge{flex:none;font-size:11px;font-weight:700;color:var(--gold);border:1px solid rgba(255,194,75,.4);border-radius:8px;padding:2px 7px;background:rgba(255,194,75,.08);min-width:44px;text-align:center}
.vdate{flex:none;font-size:11px;color:var(--dim);padding-top:3px;width:34px}
.vtxt{font-size:12.5px;line-height:1.6}
tr:hover{background:rgba(255,255,255,.025)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c3560;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a4474}
::selection{background:rgba(244,162,97,.32)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.board{background:rgba(244,162,97,.10)}
.footer-note a{color:var(--accent);text-decoration:none}
.footer-note a:hover{text-decoration:underline}
.modal{background:linear-gradient(180deg,var(--s11),var(--s12));box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lockpad .btn{margin-top:8px}
</style>
<style id="adaptive-theme">

:root{--s1:rgba(31,38,70,.72);--s2:rgba(24,30,55,.58);--s3:rgba(22,28,56,.66);--s4:rgba(30,38,74,.8);--s5:rgba(14,18,36,.82);--s6:rgba(15,18,32,.5);--s7:rgba(27,33,62,.5);--s8:rgba(33,41,76,.55);--s9:rgba(28,34,64,.96);--s10:rgba(20,25,50,.5);--s11:rgba(34,42,78,.97);--s12:rgba(24,30,55,.97);}

function addHolding(code,name,price,strat){
  if(!authed){openAuth();return}
  const c=String(code).replace(/\D/g,'').slice(-6);if(c.length!==6){toast('代码无效');return}
  if(MYH.some(h=>h.code===c&&!h.sell_price)){toast('已在自选中');return}
  const p=parseFloat(price);const now=new Date();
  MYH.push({code:c,name:name||c,strat:strat||'',shares:0,cost:isFinite(p)&&p>0?p:0,buy_time:now.toISOString().slice(0,16).replace('T',' '),added:now.toISOString().slice(0,10)});
  saveHoldings().then(()=>showTab(CUR));toast('已加入自选');
}
function delHolding(code){MYH=MYH.filter(h=>h.code!==code);saveHoldings().then(()=>showTab(CUR))}
function settleHolding(code,price){const h=MYH.find(x=>x.code===code);if(!h)return;const now=new Date();h.sell_price=(+price)||h.sell_price||0;h.sell_time=now.toISOString().slice(0,16).replace('T',' ');h.buy_time=h.buy_time||now.toISOString().slice(0,10);saveHoldings().then(()=>showTab(CUR));toast('已记卖出·可在自选复盘')}

  const basis=(!closed||!h.sell_price)?cur:(+h.sell_price);

  if(pnl!=null&&!closed&&(h.shares||0)>0){
    if(pnl<=-10)advice='⚠️ 浮亏 '+fmtp(pnl)+' · 逼近约-10%止损位,盯战法卖点 · '+advice;
    else if(pnl>=12)advice='🏆 '+fmtp(pnl)+' 浮盈 · 关注止盈/离场信号 · '+advice;

function l1verdict(code,strat){
  /* 从晚间 L1 批次(l1_today, key=6位代码)取真实判段; 无则返回null走静态文案 */
  const c=String(code).slice(-6);const r=(L1T||{})[c];
  if(!r||!r.action||r.action==='数据暂缺')return null;
  const act=r.action;
  const emo=/止损|离场|回撤卖|减仓/.test(act)?'🔴':(/过顶卖|转弱/.test(act)?'🟡':(/止盈/.test(act)?'🟢':(/接回/.test(act)?'🔄接回':(act==='持有'||act==='持有观察')?'👀':'💡')));
  return `${emo} 今日L1: ${r.reason||act}${r.date?(' ('+r.date+')'):''}`;
}
function l1For(d,h){
  const c=h.code;const z=d.zhixing||{};const strat=h.strat||'自选';
  const lv=l1verdict(c,h.strat);
  /* owner(真实仓/模拟仓): 受持有池份数影响的体系信号(买入/卖出/持有, 池满则无买入信号=天然池控) */
  if(isOwner()){
    const se=(z.sell||[]).find(x=>String(x.code).slice(-6)===c);
    if(se)return (se.is_sim?'📈 模拟盘卖出信号:':'🔴 主仓卖出信号:')+((se).verdict||'按纪律离场')+' · '+stratDesc(strat)+'。';
    const hd=(z.hold||[]).find(x=>String(x.code).slice(-6)===c);
    if(hd)return (hd.is_sim?'👀 模拟盘持有:':'👀 主仓持有:')+((hd).verdict||'持有')+' · '+stratDesc(strat)+'。';
    const bu=(z.buy||[]).find(x=>String(x.code).slice(-6)===c);
    if(bu)return (bu.is_sim?'📈 模拟盘·指星推荐买入':'🟢 指星今日推荐买入')+' · '+stratDesc(strat)+'。';
    const px=(d.poxiao.recs||[]).find(x=>String(x.code).slice(-6)===c);
    if(px)return '今日破晓在池:'+(px.name||c)+' · 预测高开+'+px.pred_gap+'% · '+(px.sell_rule||'T尾盘买、T1开盘卖')+'。';
    const ly=(d.liaoyuan||{}).buy_rank_top5||[]; if(ly.some(x=>String(x.code).slice(-6)===c))return '今日燎原浓缩池在列 · 约持30天。';
    /* owner 池状态影响: 燎原现金/份数 → 新买需池有空位 */
    const lyo=d.liaoyuan||{};
    if((''+strat).indexOf('燎原')>=0&&(''+strat).indexOf('真实')<0&&lyo.cash_left!=null)return '燎原 · 池现金 ¥'+lyo.cash_left+(lyo.funds?(' / '+lyo.funds+'份'):'')+' · 按L1状态机跟踪(模拟盘口径)。';
    if((''+strat).indexOf('真实')>=0)return stratDesc(strat)+' 真实盘持仓 · 池状态不适用, 暂无该股新信号。'; return stratDesc(strat)+' 持仓跟踪中, 暂无该股新信号。';
  }
  /* 其他用户: 先看真实 L1 状态机判段(晚间批次算好), 无则静态描述 */
  if(lv)return lv;
  const L1={'指星':'指星 L1 状态机 · 按买点/持有/过顶卖/离场跟踪, 结合你的成本给止盈止损','燎原':'燎原 L1 状态机 · 约持30天, 硬扛不设止损, 按到期γ止损/状态机离场跟踪','破晓':'破晓 L1 状态机 · T尾盘买/T1开盘卖, 冲高+1%止盈 / -0.5%回撤卖','打新':'打新 L1 · 中签上市后卖出兑现','ETF':'ETF 方向跟踪 · 按板块强弱信号给方向参考'};
  const base=(L1[strat]||(stratDesc(strat)+' · 按对应战法 L1 状态机跟踪'))+'。';
  return base+' 你的'+strat+'持仓按 L1 状态机指导, 不依赖任何持有池份数。';
}

/* ===== Auth (与语之境界同源) ===== */
function initClient(){try{if(window.supabase)DB=supabase.createClient(SB_URL,SB_ANON)}catch(e){DB=null}}
function openAuth(v){showAuthView(v||(DBUSER?'pw':'login'));$('authModal').classList.remove('hidden')}
function closeAuth(){$('authModal').classList.add('hidden')}
let PW_RESET=false;
function msgSet(i,txt,ok){const e=$(i);if(!e)return;e.style.color=ok?'var(--ok)':'var(--bad)';e.textContent=txt}
function showAuthView(v){
  $('authVLogin').style.display=v==='login'?'':'none';
  $('authVChangepw').style.display=v==='pw'?'':'none';
  $('authVForgot').style.display=v==='forgot'?'':'none';
  ['authMsg','authMsg2','authMsg3'].forEach(i=>msgSet(i,''));
  const t=$('authTitle'),st=$('authPwSub'),cur=$('authCur');
  if(v==='forgot'){t.textContent='📮 重置密码'}
  else if(v==='pw'){
    t.textContent=PW_RESET?'🔑 设置新密码':'🔑 修改密码';
    if(st)st.textContent=PW_RESET?'重置链接已验证，请设置新密码':'登录账号：'+(DBUSER?DBUSER.email:'');
    if(cur)cur.style.display=PW_RESET?'none':'';
  }else t.textContent='🔐 账号';
}
async function doChangePw(){
  const n1=$('authNew').value,n2=$('authNew2').value,cur=$('authCur').value;
  if(!PW_RESET&&!cur){msgSet('authMsg2','请输入当前密码');return}
  if(!n1||n1.length<6){msgSet('authMsg2','新密码至少6位');return}
  if(n1!==n2){msgSet('authMsg2','两次新密码不一致');return}
  if(!PW_RESET){const{error:sx}=await DB.auth.signInWithPassword({email:DBUSER.email,password:cur});if(sx){msgSet('authMsg2','当前密码错误：'+sx.message);return}}
  const{error}=await DB.auth.updateUser({password:n1});
  if(error){msgSet('authMsg2','修改失败：'+error.message);return}
  msgSet('authMsg2','✅ 密码已更新，下次用新密码登录',true);
  ['authCur','authNew','authNew2'].forEach(i=>{const e=$(i);if(e)e.value=''});
  PW_RESET=false;setTimeout(closeAuth,1400);
}
async function doSendReset(){
  const e=$('authREmail').value.trim();if(!e){msgSet('authMsg3','请输入邮箱');return}
  const{error}=await DB.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
  if(error){msgSet('authMsg3',error.message);return}
  msgSet('authMsg3','✅ 重置链接已发送，请查收（注意垃圾箱）',true);
}
async function doLogout(){try{await DB.auth.signOut()}catch(e){}PW_RESET=false;DBUSER=null;authed=false;MYH=[];DREV={};$('acctBtn').textContent='🔐 登录';closeAuth();toast&&toast('已退出');showTab(CUR)}
function toast(m){const e=el('div','','');const x=el('div','banner info',m);e.appendChild(x);document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
async function applySession(ses){const u=ses&&ses.user;if(u){DBUSER=u;authed=true;$('acctBtn').textContent='👤 '+(u.email||u.id.slice(0,6));await loadHoldings();showTab(CUR)}else{DBUSER=null;authed=false;MYH=[];AUTOH=[];SIH=[];SIMSUM={};L1T={};DREV={};$('acctBtn').textContent='🔐 登录';showTab(CUR)}}
function bindAuth(){
  $('acctBtn').onclick=()=>{DBUSER?(PW_RESET=false,openAuth('pw')):openAuth('login')};
  $('authClose').onclick=closeAuth;
  $('authForgot').onclick=()=>showAuthView('forgot');
  $('authFBack').onclick=()=>showAuthView('login');
  $('authPwBack').onclick=()=>{PW_RESET=false;closeAuth()};
  $('authSavePw').onclick=doChangePw;
  $('authSendReset').onclick=doSendReset;
  $('authLogout').onclick=doLogout;
  $('authLogin').onclick=async()=>{const e=$('authEmail').value.trim(),p=$('authPass').value;$('authMsg').textContent='';if(!e||!p){$('authMsg').textContent='请填写邮箱和密码';return}const{data,error}=await DB.auth.signInWithPassword({email:e,password:p});if(error){$('authMsg').textContent=error.message;return}closeAuth();applySession(data.session)};
  $('authRegister').onclick=async()=>{const e=$('authEmail').value.trim(),p=$('authPass').value;$('authMsg').textContent='';if(!e||!p){$('authMsg').textContent='请填写邮箱和密码';return}if(p.length<6){$('authMsg').textContent='密码至少6位';return}const{data,error}=await DB.auth.signUp({email:e,password:p});if(error){$('authMsg').textContent=error.message;return}if(data.session){closeAuth();applySession(data.session)}else{$('authMsg').textContent='注册成功,请到邮箱确认后登录'}};
}
function bindNav(){
  document.querySelectorAll('#navTabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
  $('histPrev').onclick=()=>{if(HISTI>0){HISTI--;fillHistSel();renderHist()}};
  $('histNext').onclick=()=>{if(HISTI<DATE_LIST.length-1){HISTI++;fillHistSel();renderHist()}};
  $('histDate').onchange=()=>{HISTI=+$('histDate').value;renderHist()};
  $('rvPrev').onclick=()=>{if(RVI>0){RVI--;fillReviewSel();renderReview(DAYS[DATE_LIST[RVI]],$('reviewBody'))}};
  $('rvNext').onclick=()=>{if(RVI<DATE_LIST.length-1){RVI++;fillReviewSel();renderReview(DAYS[DATE_LIST[RVI]],$('reviewBody'))}};
}
async function init(){
  initClient();bindAuth();bindNav();
  if(DB){try{const{data:{session}}=await DB.auth.getSession();applySession(session);DB.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY'){PW_RESET=true;applySession(s);showAuthView('pw');$('authModal').classList.remove('hidden')}if(ev==='SIGNED_IN'||ev==='USER_UPDATED')applySession(s);if(ev==='SIGNED_OUT')applySession(null)})}catch(e){}}
  showTab('today');
}
document.addEventListener('DOMContentLoaded',init);
</script>

<script>
/* 自适应主题: 跟随系统 / 浅色 / 深色 (2026-11-11 Frank) */
(function(){
  var key='siteTheme';
  function cur(){return document.documentElement.dataset.theme||''}
  function apply(t){document.documentElement.dataset.theme=t;
    var m=document.querySelector('meta[name=theme-color]');
    if(m)m.content=(t==='light')?'#f3f5fb':(t==='dark'?'#0d1020':'#0d1020');
  }
  function saved(){try{return localStorage.getItem(key)||''}catch(e){return ''}}
  function sysDark(){try{return matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}}
  function resolve(){var s=saved();if(!s)return sysDark()?'dark':'light';return s}
  apply(resolve());
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(!saved())apply(sysDark()?'dark':'light');});}catch(e){}
  var order=['system','light','dark'];
  var btn=document.getElementById('themeBtn'); var created=false;
  if(!btn){btn=document.createElement('button');created=true;btn.id='themeBtn';btn.style.cssText='position:fixed;z-index:99;right:12px;top:60px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.25)';}
  btn.title='主题: 跟随系统'; btn.textContent='🌓';
  function visOf(m){return m==='system'?(sysDark()?'dark':'light'):m}
  function setMode(m){try{localStorage.setItem(key,m)}catch(e){}
    apply(visOf(m));
    btn.textContent=(m==='system')?'🌓':(m==='light'?'☀️':'🌙');
    btn.title='主题: '+({system:'跟随系统',light:'浅色',dark:'深色'})[m];
  }
  btn.onclick=function(){
    var modes=['system','light','dark'];
    var start=modes.indexOf(saved()||'system'); if(start<0)start=0;
    var prevVis=document.documentElement.dataset.theme;
    for(var k=1;k<=modes.length;k++){var m=modes[(start+k)%modes.length];if(visOf(m)!==prevVis){setMode(m);return;}}
    setMode(modes[(start+1)%modes.length]);
  };
  document.addEventListener('DOMContentLoaded',function(){if(created)document.body.appendChild(btn);
    var s=saved();btn.textContent=(s==='light')?'☀️':(s==='dark'?'🌙':'🌓');});
  window.__themeCurrent=cur;
})();
</script>
